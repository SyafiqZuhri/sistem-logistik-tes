name: CI/CD Pipeline Anteraja

on:
  push:
    branches: [ "main" ]

jobs:
  test-koneksi:
    runs-on: ubuntu-latest
    steps:
      - name: Tes Koneksi SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "--- KONEKSI BERHASIL! ---"
            whoami
            pwd
            ls -F
